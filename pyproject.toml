[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uise"
version = "0.1.0"
description = "Proof of what AI agents did: signed, tamper-evident receipts for autonomous agents. UIP-1 protocol and SDK."
readme = "README.md"
# The protocol core runs on any 3.9. The floor is set by `cryptography`, which
# excludes 3.9.0 and 3.9.1; promising plain ">=3.9" would be a claim the package
# cannot keep on those two patch releases.
requires-python = ">=3.9.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ever Mencia" }]
keywords = [
    "agents", "ai-agents", "protocol", "receipts", "audit",
    "transparency-log", "merkle-tree", "did", "post-quantum", "uip",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

# The protocol core (`uip`) has no dependencies at all - that is deliberate, so
# the conformance suite runs anywhere. Only the SDK (`uise`) needs cryptography,
# which supplies constant-time Ed25519 and NIST ML-DSA. No hand-rolled
# cryptography ships in this project.
dependencies = ["cryptography>=46.0"]

[project.optional-dependencies]
# `openapi-spec-validator` checks the generated contract against the real OpenAPI
# specification. Asserting that a document "looks right" is not the same as
# knowing a validator accepts it. Both dev tools require Python 3.10, which is
# why the 3.9 floor is exercised by running the demonstration instead of pytest.
dev = ["pytest>=8", "openapi-spec-validator>=0.7"]

[project.urls]
Homepage = "https://github.com/ever-sv/Uise"
Repository = "https://github.com/ever-sv/Uise"
Issues = "https://github.com/ever-sv/Uise/issues"
Specification = "https://github.com/ever-sv/Uise/blob/main/spec/uip-1.md"
Conformance = "https://github.com/ever-sv/Uise/tree/main/conformance"

[tool.setuptools]
# Listed explicitly rather than discovered. `uise.bridges` is easy to forget, and
# forgetting it ships a distribution where `import uise` fails on the first line
# - a break that never appears in development, only after publishing.
packages = ["uip", "uise", "uise.bridges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
