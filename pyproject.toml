[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uise"
version = "0.1.0"
description = "Uise Interoperability Protocol (UIP-1): identity, verifiable messaging and signed receipts for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Uise" }]
keywords = ["agents", "protocol", "did", "post-quantum", "receipts", "uip"]

# The protocol core (`uip`) has no dependencies at all - that is deliberate, so
# the conformance suite runs anywhere. Only the SDK (`uise`) needs cryptography,
# which supplies constant-time Ed25519 and NIST ML-DSA. No hand-rolled
# cryptography ships in this project.
dependencies = ["cryptography>=46.0"]

[project.optional-dependencies]
# `openapi-spec-validator` checks the generated contract against the real OpenAPI
# specification. Asserting that a document "looks right" is not the same as
# knowing a validator accepts it.
dev = ["pytest>=8", "openapi-spec-validator>=0.7"]

[tool.setuptools]
packages = ["uip", "uise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
